[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shubuun"]

[project]
name = "shubuun"
version = "0.1.0"
description = "shubuun — course project and homework assignments"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pytest>=9.0.2",
    "lightning>=2.0",
    "thop>=0.1.1",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchcodec>=0.10.0",
    "pandas>=3.0.1",
    "scikit-learn>=1.0",
    "transformers>=5.3.0",
    "kenlm>=0.3.0",
    "levenshtein>=0.27.3",
    "jiwer>=4.0.0",
    "datasets>=4.8.3",
    "soundfile>=0.13.1",
    "librosa>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
