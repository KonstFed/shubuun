[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shubuun"]

[project]
name = "shubuun"
version = "0.1.0"
description = "shubuun — course project and homework assignments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.2",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
